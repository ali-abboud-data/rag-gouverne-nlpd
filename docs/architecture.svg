<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 640" width="1360" height="640" font-family="Inter, -apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs>
<linearGradient id="gBlue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F5FBF"/><stop offset="1" stop-color="#3E8EDE"/></linearGradient>
<linearGradient id="gNavy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B2545"/><stop offset="1" stop-color="#1B4380"/></linearGradient>
<linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F7FAFF"/><stop offset="1" stop-color="#EEF4FD"/></linearGradient>
<filter id="sh" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0B2545" flood-opacity="0.16"/></filter>
<marker id="a" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1,1 L9,5 L1,9 z" fill="#3E6FA8"/></marker>
</defs>
<rect width="1360" height="640" fill="url(#gBg)"/>
<text x="40" y="44" font-size="22" font-weight="700" fill="#0B2545">Governed RAG on the Swiss FADP</text>
<text x="40" y="66" font-size="13" fill="#4A6485">Architecture: ingestion once, then retrieval, answer and checks on every request</text>
<rect x="30" y="86" width="1300" height="130" rx="16" fill="#E4EEFB" stroke="#CFE0F7"/><text x="52" y="112" font-size="11.5" font-weight="700" fill="#1F5FBF" letter-spacing="1.6">INGESTION  ·  ONCE</text>
<rect x="62" y="118" width="162" height="84" rx="12" fill="url(#gBlue)" stroke="none" stroke-width="1.4" filter="url(#sh)"/><circle cx="79" cy="135" r="9.5" fill="#FFFFFF"/><text x="79" y="139.2" text-anchor="middle" font-size="11" font-weight="700" fill="#1F5FBF">1</text><text x="153.0" y="148" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Fedlex PDF</text><text x="143.0" y="170" text-anchor="middle" font-size="12" fill="#E3EEFF">Swiss Federal Act on</text><text x="143.0" y="186" text-anchor="middle" font-size="12" fill="#E3EEFF">Data Protection (RS 235.1)</text>
<line x1="226" y1="160" x2="242" y2="160" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="244" y="118" width="162" height="84" rx="12" fill="url(#gBlue)" stroke="none" stroke-width="1.4" filter="url(#sh)"/><circle cx="261" cy="135" r="9.5" fill="#FFFFFF"/><text x="261" y="139.2" text-anchor="middle" font-size="11" font-weight="700" fill="#1F5FBF">2</text><text x="335.0" y="148" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Parse</text><text x="325.0" y="170" text-anchor="middle" font-size="12" fill="#E3EEFF">One passage per article</text><text x="325.0" y="186" text-anchor="middle" font-size="12" fill="#E3EEFF">74 articles, 91 passages</text>
<line x1="408" y1="160" x2="424" y2="160" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="426" y="118" width="162" height="84" rx="12" fill="url(#gBlue)" stroke="none" stroke-width="1.4" filter="url(#sh)"/><circle cx="443" cy="135" r="9.5" fill="#FFFFFF"/><text x="443" y="139.2" text-anchor="middle" font-size="11" font-weight="700" fill="#1F5FBF">3</text><text x="517.0" y="148" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Tag and embed</text><text x="507.0" y="170" text-anchor="middle" font-size="12" fill="#E3EEFF">Audience tag and</text><text x="507.0" y="186" text-anchor="middle" font-size="12" fill="#E3EEFF">E5 embeddings</text>
<line x1="590" y1="160" x2="606" y2="160" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="608" y="118" width="162" height="84" rx="12" fill="url(#gNavy)" stroke="none" stroke-width="1.4" filter="url(#sh)"/><circle cx="625" cy="135" r="9.5" fill="#FFFFFF"/><text x="625" y="139.2" text-anchor="middle" font-size="11" font-weight="700" fill="#1F5FBF">4</text><text x="699.0" y="148" text-anchor="middle" font-size="14.5" font-weight="700" fill="#FFFFFF">Qdrant</text><text x="689.0" y="170" text-anchor="middle" font-size="12" fill="#C9DBF5">Vector database,</text><text x="689.0" y="186" text-anchor="middle" font-size="12" fill="#C9DBF5">article and audience tags</text>
<rect x="30" y="262" width="1300" height="150" rx="16" fill="#E4EEFB" stroke="#CFE0F7"/><text x="52" y="288" font-size="11.5" font-weight="700" fill="#1F5FBF" letter-spacing="1.6">ANSWERING  ·  EACH REQUEST</text>
<rect x="62" y="298" width="162" height="84" rx="12" fill="#F4F8FE" stroke="#B7D3F5" stroke-width="1.4" filter="url(#sh)"/><text x="153.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B2545">Client</text><text x="143.0" y="350" text-anchor="middle" font-size="12" fill="#4A6485">Question + API key</text>
<line x1="226" y1="340" x2="242" y2="340" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="244" y="298" width="162" height="84" rx="12" fill="#FFFFFF" stroke="#9CC2F0" stroke-width="1.4" filter="url(#sh)"/><circle cx="261" cy="315" r="9.5" fill="#1F5FBF"/><text x="261" y="319.2" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">1</text><text x="335.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B2545">FastAPI</text><text x="325.0" y="350" text-anchor="middle" font-size="12" fill="#4A6485">Role taken from the</text><text x="325.0" y="366" text-anchor="middle" font-size="12" fill="#4A6485">API key, not the request</text>
<line x1="408" y1="340" x2="424" y2="340" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="426" y="298" width="162" height="84" rx="12" fill="#FFFFFF" stroke="#9CC2F0" stroke-width="1.4" filter="url(#sh)"/><circle cx="443" cy="315" r="9.5" fill="#1F5FBF"/><text x="443" y="319.2" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">2</text><text x="517.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B2545">Rewrite</text><text x="507.0" y="350" text-anchor="middle" font-size="12" fill="#4A6485">LLM restates the question</text><text x="507.0" y="366" text-anchor="middle" font-size="12" fill="#4A6485">in the law's vocabulary</text>
<line x1="590" y1="340" x2="606" y2="340" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="608" y="298" width="162" height="84" rx="12" fill="#FFFFFF" stroke="#9CC2F0" stroke-width="1.4" filter="url(#sh)"/><circle cx="625" cy="315" r="9.5" fill="#1F5FBF"/><text x="625" y="319.2" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">3</text><text x="699.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B2545">Search</text><text x="689.0" y="350" text-anchor="middle" font-size="12" fill="#4A6485">Embeds the question</text><text x="689.0" y="366" text-anchor="middle" font-size="12" fill="#4A6485">and its rewritten form</text>
<line x1="772" y1="340" x2="788" y2="340" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="790" y="298" width="162" height="84" rx="12" fill="#FFFFFF" stroke="#9CC2F0" stroke-width="1.4" filter="url(#sh)"/><circle cx="807" cy="315" r="9.5" fill="#1F5FBF"/><text x="807" y="319.2" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">4</text><text x="881.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B2545">Answer</text><text x="871.0" y="350" text-anchor="middle" font-size="12" fill="#4A6485">LLM answers only from</text><text x="871.0" y="366" text-anchor="middle" font-size="12" fill="#4A6485">passages, or refuses</text>
<line x1="954" y1="340" x2="970" y2="340" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="972" y="298" width="162" height="84" rx="12" fill="#FFFFFF" stroke="#9CC2F0" stroke-width="1.4" filter="url(#sh)"/><circle cx="989" cy="315" r="9.5" fill="#1F5FBF"/><text x="989" y="319.2" text-anchor="middle" font-size="11" font-weight="700" fill="#FFFFFF">5</text><text x="1063.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B2545">Check</text><text x="1053.0" y="350" text-anchor="middle" font-size="12" fill="#4A6485">Cited articles must be</text><text x="1053.0" y="366" text-anchor="middle" font-size="12" fill="#4A6485">retrieved or referenced</text>
<line x1="1136" y1="340" x2="1152" y2="340" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<rect x="1154" y="298" width="162" height="84" rx="12" fill="#F4F8FE" stroke="#B7D3F5" stroke-width="1.4" filter="url(#sh)"/><text x="1245.0" y="328" text-anchor="middle" font-size="14.5" font-weight="700" fill="#0B2545">Response</text><text x="1235.0" y="350" text-anchor="middle" font-size="12" fill="#4A6485">Answer, cited articles,</text><text x="1235.0" y="366" text-anchor="middle" font-size="12" fill="#4A6485">refusal flag, warnings</text>
<line x1="689.0" y1="202" x2="689.0" y2="296" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" marker-end="url(#a)"/>
<text x="703.0" y="252" text-anchor="start" font-size="11.5" font-style="italic" fill="#4A6485">role filter applied inside the query</text>
<rect x="244" y="450" width="890" height="88" rx="14" fill="#FFFFFF" stroke="#3E8EDE" stroke-width="1.5" stroke-dasharray="7 5"/>
<text x="689.0" y="478" text-anchor="middle" font-size="15" font-weight="700" fill="#0B2545">Evaluation harness</text>
<text x="689.0" y="500" text-anchor="middle" font-size="12.5" fill="#4A6485">53 hand-checked questions, 3 runs, with and without query rewriting</text>
<text x="689.0" y="518" text-anchor="middle" font-size="12.5" fill="#4A6485">right article retrieved and cited, refusals, unsupported citations, access violations, time, tokens</text>
<line x1="689.0" y1="450" x2="689.0" y2="386" stroke="#3E6FA8" stroke-width="1.8" stroke-linecap="round" stroke-dasharray="6 5" marker-end="url(#a)"/>
<text x="703.0" y="432" text-anchor="start" font-size="11.5" font-style="italic" fill="#4A6485">calls the same pipeline</text>
<text x="40" y="582" font-size="12" fill="#4A6485">Logs record role, duration, refusal, tokens and question length, never the question text.</text>
<text x="40" y="600" font-size="12" fill="#4A6485">The access policy is simulated (the law is public) to demonstrate filtering inside the vector query: a restricted passage never reaches the LLM.</text>
<text x="40" y="618" font-size="12" fill="#4A6485">Without API keys configured (development mode) the role is read from the request body. Langfuse tracing is not implemented.</text>
</svg>